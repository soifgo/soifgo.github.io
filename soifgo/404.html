<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | SoifGo</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { --bg:#f8fafc; --fg:#0f172a; --link:#2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e2e8f0; --link:#60a5fa; } }
    body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
           max-width:36rem; margin:15vh auto; padding:0 1.2rem; line-height:1.6; }
    a { color:var(--link); }
  </style>
</head>
<body>
  <h1>Page not found</h1>
  <p id="moved" hidden>
    This SoifGo page moved. The new address is
    <a id="newlink" href="https://soifgo.github.io/">https://soifgo.github.io/</a>.
  </p>
  <p>Go to the <a href="https://soifgo.github.io/">SoifGo home page</a>
     (documentation, examples and downloads).</p>

  <script>
    (function () {
      var path = location.pathname;
      // Old layout: every page lived under /soifgo/. Now everything is at the site root.
      if (path.indexOf('/soifgo/') === 0) {
        var np = path.replace(/^\/soifgo\//, '/');
        // Old tutorials lived under /tutorials/server/<name>/ ; now they are at /<name>/
        np = np.replace(/^\/tutorials\/server\//, '/');
        var target = 'https://soifgo.github.io' + np + location.search + location.hash;
        var link = document.getElementById('newlink');
        link.href = target; link.textContent = target;
        document.getElementById('moved').hidden = false;
        location.replace(target);
      }
    })();
  </script>
</body>
</html>
